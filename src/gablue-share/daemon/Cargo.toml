[package]
name = "gablue-shared"
version = "0.1.0"
edition = "2021"
description = "Démon de partage de fichiers Gablue (LAN et Tailscale, lecture seule)"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
libc = "0.2"
# Icône de zone de notification : StatusNotifierItem par DBus, sans toolkit.
# `async-io` plutôt que tokio : un exécuteur minimal, pas un runtime complet.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
