[Profile]
profile_id = gablue

[Profile Detection]
os_id = gablue

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
# Doit correspondre au répertoire EFI réellement écrit par bootc/shim
# (EFI/fedora) : le %pre-install du kickstart supprime ce même chemin.
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
