name: build-gablue-live-isos
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
  actions: read

on:
  workflow_dispatch:
  # Tous les 5 jours à 06:00 UTC : la cadence est pilotée par la rétention
  # BuzzHeavier (8 j de base + 2 j par téléchargement, 60 j max — page tarifs ;
  # 15/+3/45 sur la page d'aide), pas par la fraîcheur du payload : la release
  # GitHub ne porte que les CHECKSUMS, les ISO vivent uniquement sur
  # BuzzHeavier. Une cadence hebdomadaire laisserait 1 j de marge avant
  # expiration du lien, et un build raté le tuerait.
  schedule:
    - cron: "0 6 */5 * *"
  # Un push tagué ne déclenche plus CE workflow : `gablue-builds.yml` l'appelle
  # (`[iso]` seul, ou `[all-iso]` après les cinq images). C'est ce qui supprime
  # le run ISO « skipped » créé à chaque push sur `main` : un déclencheur
  # `push` ne peut pas filtrer sur le message de commit, seul le job le peut —
  # donc le run existait pour rien. Ici comme appelé, `github.event` reste
  # celui de l'appelant (`push`), d'où le job `retry` qui se garde sur
  # `event == 'schedule'`.
  workflow_call:

concurrency:
  # `github.run_id` rend chaque run ISO unique : deux builds (planifiée,
  # appelée par un push, ou dispatch) ne s'annulent jamais entre elles.
  group: ${{ github.workflow }}-${{ github.run_id }}-iso
  cancel-in-progress: true

jobs:
  # Le build vit dans un workflow réutilisable pour être rejouable DANS ce run
  # (job `retry`) au lieu de repartir dans un workflow `workflow_run` — ce
  # dernier créait un run fantôme à chaque fin de run du workflow d'images,
  # qu'il soit annulé, sauté ou manuel.
  build-live-iso:
    name: Build Live ISO
    uses: ./.github/workflows/reusable-gablue-iso.yml
    secrets: inherit

  # Même filet de sécurité que pour les images, et même portée : seule une
  # exécution PLANIFIÉE, à sa PREMIÈRE tentative, rejoue (un push tagué qui
  # échoue se voit tout de suite ; un « Re-run » manuel est déjà une décision
  # humaine). Sans ça, un build ISO raté laissait la release `latest-live-iso`
  # sans lien frais, et les fichiers BuzzHeavier expirent en 8 jours.
  retry:
    name: Rejouer la build ISO planifiée
    needs: build-live-iso
    if: failure() && github.event_name == 'schedule' && github.run_attempt == 1
    uses: ./.github/workflows/reusable-gablue-iso.yml
    secrets: inherit

  create-release:
    needs: [build-live-iso, retry]
    # `always()` : un run planifié sauvé par le rejeu porte encore le `needs` en
    # échec de la première salve. Les artifacts vivent dans CE run, donc le
    # rejeu les republie sous les mêmes noms (d'où `overwrite: true` dans le
    # build) et la release se crée normalement.
    if: always() && (needs.build-live-iso.result == 'success' || needs.retry.result == 'success')
    runs-on: ubuntu-26.04
    # 10 → 30 min : les deux steps de téléchargement d'artifacts peuvent
    # désormais patienter ~4 min 30 s chacun (10 × 30 s) lors d'un incident
    # de stockage GitHub ; 10 min ne laissaient pas la place au retry.
    timeout-minutes: 30
    steps:
      # Téléchargement via gh CLI avec retry : l'API artifacts GitHub peut
      # renvoyer un 404 "workflow run not found" transitoire juste après la
      # fin des jobs ISO (race condition de propagation interne, cf. run
      # 30193960415 attempt 2) ou des 503 « Egress is over the account
      # limit » (incident de stockage côté GitHub, durée de plusieurs
      # minutes — cf. run 39912731811 sur le workflow d'images). Fenêtre
      # large : 10 × 30 s ≈ 4 min 30 s. on_retry_command vide le dossier
      # partiel pour qu'aucun fichier d'une tentative précédente ne fasse
      # passer la vérification suivante à tort.
      # gh run download supporte les glob patterns et crée un sous-dossier
      # par artifact (même structure que actions/download-artifact avec
      # merge-multiple: false).
      - name: Télécharger les artifacts liens
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_wait_seconds: 30
          on_retry_command: rm -rf links
          command: |
            mkdir -p links
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -p '*-live-link' -D links
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Télécharger les artifacts checksums
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_wait_seconds: 30
          on_retry_command: rm -rf checksums
          command: |
            mkdir -p checksums
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -p '*-live-checksum' -D checksums
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release body
        run: |
          {
            echo "## Gablue Live ISO"
            echo ""
            echo "Live ISOs with full Plasma desktop environment."
            echo "Try Gablue before installing!"
            echo ""
            echo "### Downloads"
            for link_file in links/*/*.txt; do
              ISO_NAME=$(basename "$(dirname "$link_file")" | sed 's/-live-link$//')
              LINK=$(cat "$link_file")
              echo "- **${ISO_NAME}**: ${LINK}"
            done
            echo ""
            echo "> **Note**: Verify the SHA256 checksum before installing."
          } > body.md

      - name: Supprimer l'ancienne release live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-live-iso" | jq -r '.id')
          if [ "$RELEASE_ID" != "null" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "latest-live-iso"
          name: "Latest Live ISO Release"
          body_path: body.md
          files: checksums/*/*-CHECKSUM
          draft: false
          prerelease: false
