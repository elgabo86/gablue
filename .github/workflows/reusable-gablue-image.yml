name: Reusable Build Image
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_desc:
        required: true
        type: string
      image_variant:
        required: true
        type: string
      source_image:
        required: true
        type: string
      source_suffix:
        required: false
        type: string
        default: ""
      fedora_version:
        required: true
        type: string
      kernel_type:
        required: true
        type: string
      kernel_version:
        required: false
        type: string
        # Vide = suit automatiquement la version kernel pinnée par Bazzite (branche testing)
        default: ""
      nvidia_flavor:
        required: false
        type: string
        default: ""
      containerfile:
        required: false
        type: string
        default: ""

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build:
    name: ${{ inputs.image_name }}-${{ inputs.fedora_version }}
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Étape pour récupérer la version du kernel
      # Source de vérité : la version pinnée par Bazzite (branche testing) dans
      # la matrice de son workflow build.yml. Fallback sur le dernier tag akmods
      # via skopeo si la récupération ou le parsing échoue.
      - name: Get kernel version
        id: get_kernel_version
        if: inputs.kernel_version == ''
        run: |
          KERNEL_FLAVOR="${{ inputs.kernel_type }}"
          FEDORA_VERSION="${{ inputs.fedora_version }}"

          # Récupérer le build.yml de Bazzite testing (retry : timeouts réseau possibles)
          BAZZITE_URL="https://raw.githubusercontent.com/ublue-os/bazzite/testing/.github/workflows/build.yml"
          BUILD_YML=""
          for attempt in 1 2 3; do
            if BUILD_YML=$(curl -fsSL "$BAZZITE_URL"); then
              echo "Récupération du build.yml Bazzite réussie à la tentative $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Impossible de récupérer le build.yml Bazzite après 3 tentatives"
            fi
            echo "curl tentative $attempt échouée, retry dans 10s..."
            sleep 10
          done

          # Parser l'entrée de la matrice correspondant à notre flavor/version Fedora
          KERNEL_VERSION=""
          if [ -n "$BUILD_YML" ]; then
            KERNEL_VERSION=$(echo "$BUILD_YML" | awk -v fv="$FEDORA_VERSION" -v kf="$KERNEL_FLAVOR" '
              /^[[:space:]]*- fedora_version:/ { cur_fv=$3 }
              /^[[:space:]]*kernel_flavor:/ { cur_kf=$2 }
              /^[[:space:]]*kernel_version:/ { if (cur_fv == fv && cur_kf == kf) { print $2; exit } }
            ')
          fi

          # Bazzite peut pinner une version dont les images akmods ne sont pas
          # encore publiées (leur CI akmods build en avance) : vérifier que le
          # tag existe, sinon fallback sur le dernier tag disponible
          if [ -n "$KERNEL_VERSION" ]; then
            if skopeo inspect "docker://ghcr.io/ublue-os/akmods:${KERNEL_FLAVOR}-${FEDORA_VERSION}-${KERNEL_VERSION}" >/dev/null 2>&1; then
              echo "Using ${KERNEL_FLAVOR} kernel from Bazzite testing: $KERNEL_VERSION"
            else
              echo "::warning::Bazzite pinne $KERNEL_VERSION mais l'image akmods correspondante n'est pas encore publiée"
              KERNEL_VERSION=""
            fi
          fi

          if [ -z "$KERNEL_VERSION" ]; then
            # Fallback : dernier tag disponible dans ublue-os/akmods
            echo "::warning::Version kernel introuvable chez Bazzite, fallback sur le dernier tag akmods"
            TAGS_JSON=""
            for attempt in 1 2 3; do
              TAGS_JSON=$(skopeo list-tags "docker://ghcr.io/ublue-os/akmods" 2>&1)
              if echo "$TAGS_JSON" | jq -e '.Tags' >/dev/null 2>&1; then
                echo "skopeo list-tags réussi à la tentative $attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Impossible de lister les tags akmods après 3 tentatives"
                echo "$TAGS_JSON"
                exit 1
              fi
              echo "skopeo list-tags tentative $attempt échoué, retry dans 10s..."
              sleep 10
            done

            # Filtrer les tags pour trouver le kernel correspondant à la version Fedora
            # Pattern: {KERNEL_FLAVOR}-{FEDORA_VERSION}-{KERNEL_VERSION}
            # Exclure les alias non versionnés (ex. ogc-44-x86_64) : la version
            # doit commencer par un chiffre
            KERNEL_VERSION=$(echo "$TAGS_JSON" | jq -r --arg kf "$KERNEL_FLAVOR" --arg fv "$FEDORA_VERSION" '
              .Tags[]
              | select(startswith($kf + "-" + $fv + "-"))
              | sub($kf + "-" + $fv + "-"; "")
              | select(test("^[0-9]"))
            ' | sort -V | tail -1)

            if [[ -z "$KERNEL_VERSION" ]] || [[ "$KERNEL_VERSION" == "null" ]]; then
              echo "::error::Impossible de trouver un kernel ${KERNEL_FLAVOR} pour Fedora $FEDORA_VERSION"
              echo "Tags disponibles:"
              echo "$TAGS_JSON" | jq -r '.Tags[]'
              exit 1
            fi

            echo "Using latest ${KERNEL_FLAVOR} kernel from akmods tags: $KERNEL_VERSION"
          fi

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "KERNEL_FLAVOR=$KERNEL_FLAVOR" >> $GITHUB_OUTPUT

      # Étape pour définir la version du noyau
      - name: Determine kernel version
        id: determine_kernel_version
        run: |
          if [[ -n "${{ inputs.kernel_version }}" ]]; then
            KERNEL_VERSION="${{ inputs.kernel_version }}"
          elif [[ -n "${{ steps.get_kernel_version.outputs.KERNEL_VERSION }}" ]]; then
            KERNEL_VERSION="${{ steps.get_kernel_version.outputs.KERNEL_VERSION }}"
          else
            echo "Erreur : Aucune version du noyau spécifiée ou trouvée pour Fedora ${{ inputs.fedora_version }}"
            exit 1
          fi
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_OUTPUT

      # Générer un timestamp unique pour tout le workflow
      - name: Generate timestamp
        id: timestamp
        run: |
          BUILD_VERSION="$(date +'%Y%m%d-%Hh%M')"
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "Generated build version: $BUILD_VERSION"

      # Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Timestamp de début pour calculer la durée
      - name: Start timer
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      # Optimisation de l'espace
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75b19501bd73b6c01b2bc5aafd63cba2653 # v10

      # Mount BTRFS for podman storage (performance + compression)
      - name: Mount BTRFS for podman storage
        uses: ./.github/actions/mount-btrfs-storage
        with:
          target-dir: /var/lib/containers

      # Préparer la clé de signature Secure Boot pour le module cpuid_fault
      - name: Prepare SB signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.GABLUE_KMOD_KEY }}" ]; then
            echo "${{ secrets.GABLUE_KMOD_KEY }}" > /tmp/gablue-kmod-key
            echo "Secure Boot signing key prepared"
          else
            echo "No Secure Boot key available, module will be unsigned"
          fi

      # Construction de l'image (retry uniquement sur erreurs réseau transitoires)
      # timeout_minutes est géré par nick-fields/retry en interne (seul mécanisme
      # de timeout fiable dans les workflows réutilisables)
      - name: Build Image
        id: build_image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          # DX installe beaucoup plus de RPMs (qemu, libvirt, docker...) via des
          # miroirs parfois lents -> 120 min, sinon 90 min
          timeout_minutes: ${{ (inputs.image_name == 'gablue-main-dx' || inputs.image_name == 'gablue-nvidia-open-dx') && 120 || 90 }}
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            # Nettoyage d'un éventuel build partiel
            sudo buildah rmi raw-img 2>/dev/null || true

            # Choisir le bon Containerfile
            if [[ -n "${{ inputs.containerfile }}" ]]; then
              CONTAINERFILE="${{ inputs.containerfile }}"
            else
              CONTAINERFILE="Containerfile-gablue"
            fi

            IMAGE_DATE=$(date -u +%Y%m%d.%H)

            DX_MODE_ARG=""
            if [[ "${{ inputs.image_name }}" == "gablue-main-dx" || "${{ inputs.image_name }}" == "gablue-nvidia-open-dx" ]]; then
              DX_MODE_ARG="--build-arg DX_MODE=true"
            fi

            NVIDIA_FLAVOR_ARG=""
            if [[ -n "${{ inputs.nvidia_flavor }}" ]]; then
              NVIDIA_FLAVOR_ARG="--build-arg NVIDIA_FLAVOR=${{ inputs.nvidia_flavor }}"
            fi

            SOURCE_SUFFIX_ARG=""
            if [[ -n "${{ inputs.source_suffix }}" ]]; then
              SOURCE_SUFFIX_ARG="--build-arg SOURCE_SUFFIX=${{ inputs.source_suffix }}"
            fi

            SB_KEY_ARG=""
            if [ -f /tmp/gablue-kmod-key ]; then
              SB_KEY_ARG="--secret=id=gablue-kmod-key,src=/tmp/gablue-kmod-key"
            fi

            # Lancement du build avec capture de la sortie
            # pipefail obligatoire : sans lui, $? capture le code de tee (0)
            # au lieu de buildah, masquant tout échec de build (nick-fields/retry
            # n'hérite pas du pipefail de GitHub Actions)
            BUILD_LOG=$(mktemp)
            set +e -o pipefail
            sudo buildah build \
              --file "$CONTAINERFILE" \
              --format "docker" \
              --build-arg KERNEL_VERSION="${{ steps.determine_kernel_version.outputs.KERNEL_VERSION }}" \
              --build-arg VARIANT="${{ inputs.image_variant }}" \
              --build-arg SOURCE_IMAGE="${{ inputs.source_image }}" \
              --build-arg FEDORA_VERSION="${{ inputs.fedora_version }}" \
              --build-arg KERNEL_FLAVOR="${{ inputs.kernel_type }}" \
              --build-arg IMAGE_DATE="$IMAGE_DATE" \
              $NVIDIA_FLAVOR_ARG \
              $SOURCE_SUFFIX_ARG \
              $DX_MODE_ARG \
              $SB_KEY_ARG \
              --tag raw-img . 2>&1 | tee "$BUILD_LOG"
            EXIT_CODE=$?
            set -e

            if [ "$EXIT_CODE" -eq 0 ]; then
              rm -f "$BUILD_LOG"
              exit 0
            fi

            # Détection erreur réseau vs build
            if grep -qiE '(TLS handshake timeout|i/o timeout|connection refused|connection reset|no route to host|could not resolve|Temporary failure in name resolution|request canceled while waiting for connection|dial tcp|net/http: request canceled|unexpected EOF|read: connection reset by peer|curl error.*Timeout)' "$BUILD_LOG"; then
              echo "::warning::Erreur réseau détectée, retry dans 20s..."
              rm -f "$BUILD_LOG"
              exit 1
            fi

            echo "::error::Erreur de build (non réseau), abandon."
            rm -f "$BUILD_LOG"
            exit 2

      # Appliquer les labels OCI avant le rechunk
      - name: Apply Labels
        id: relabel
        env:
          IMAGE_LABELS: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=${{ inputs.image_desc }}
            org.opencontainers.image.title=${{ inputs.image_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Universal Blue
        run: |
          version="${{ steps.timestamp.outputs.build_version }}"

          # Clean out labels from base image
          img=raw-img
          container=$(sudo buildah from $img)
          sudo buildah config --label "-" $container
          sudo buildah commit --identity-label=false --rm $container $img

          kver=$(sudo podman run --rm "$img" rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel-core)

          # Préparer les labels
          declare -a labels
          labels+=("org.opencontainers.image.version=$version")
          labels+=("org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')")
          labels+=("ostree.bootable=true")
          labels+=("ostree.linux=$kver")
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            labels+=("$line")
          done <<< "$IMAGE_LABELS"

          # Générer le manifest
          filter='{ "packages": [inputs | split(" ") | select(length==2) | { (.[0]): .[1] }] | sort_by(keys) | add }'
          manifest=$(sudo podman run --rm "$img" rpm -qa --qf '%{NAME} %{VERSION}\n' | jq -Rnc "$filter")
          labels+=("ostree.rechunk.info=$manifest")

          # Appliquer les labels et annotations (comme Bazzite)
          container=$(sudo buildah from $img)
          for line in "${labels[@]}"; do
            [ -z "$line" ] && continue
            sudo buildah config --label "$line" --annotation "$line" "$container"
          done

          sudo buildah commit --identity-label=false --rm $container $img
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Extraction des versions pour mise à jour du README
      - name: Extract package versions
        id: extract_versions
        run: |
          img="raw-img"
          
          # Extraire les versions des paquets principaux
          kernel_ver=$(sudo podman run --rm "$img" rpm -q --qf "%{VERSION}-%{RELEASE}" kernel-core 2>/dev/null || echo "N/A")
          mesa_ver=$(sudo podman run --rm "$img" rpm -q --qf "%{VERSION}" mesa-dri-drivers.x86_64 2>/dev/null || echo "N/A")
          plasma_ver=$(sudo podman run --rm "$img" rpm -q --qf "%{VERSION}" plasma-desktop 2>/dev/null || echo "N/A")
          nvidia_ver="N/A"
          if sudo podman run --rm "$img" rpm -q nvidia-driver &>/dev/null; then
            nvidia_ver=$(sudo podman run --rm "$img" rpm -q --qf "%{VERSION}" nvidia-driver 2>/dev/null || echo "N/A")
          fi
          fedora_ver="${{ inputs.fedora_version }}"
          
          # Générer le JSON des versions (nom de fichier unique par image)
          VER_FILE="${{ inputs.image_name }}.json"
          jq -n \
            --arg image "${{ inputs.image_name }}" \
            --arg fedora "$fedora_ver" \
            --arg kernel "$kernel_ver" \
            --arg mesa "$mesa_ver" \
            --arg plasma "$plasma_ver" \
            --arg nvidia "$nvidia_ver" \
            '{
              image: $image,
              fedora: $fedora,
              kernel: $kernel,
              mesa: $mesa,
              plasma: $plasma,
              nvidia: $nvidia
            }' > "$VER_FILE"
          
          echo "Versions extraites pour ${{ inputs.image_name }} :"
          cat "$VER_FILE"
          
      - name: Upload versions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: versions-${{ inputs.image_name }}
          path: ${{ inputs.image_name }}.json
          retention-days: 7

      # Vérification SecureBoot : les kmods doivent être signés avec la clé Gablue
      - name: SecureBoot check
        shell: bash
        run: |
          kver=$(sudo podman run --rm raw-img rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)
          echo "Kernel: $kver"

          sudo podman run --rm raw-img test -f /etc/pki/akmods/certs/gablue-secure-boot.der \
            || { echo "::error::Gablue SecureBoot certificate missing"; exit 1; }
          echo "Certificate OK"

          # Vérifie qu'un module (par nom) est signé. modinfo -k cible le kernel
          # de l'image et gère automatiquement le chemin et la compression
          # (in-tree = .ko non compressé, akmods = .ko.xz)
          check_signed() {
            # Capture la sortie avant grep : grep -q ferme le pipe au premier
            # match et envoie SIGPIPE à modinfo (exit 141), ce qui ferait
            # échouer le pipeline sous pipefail pour les modules à sortie longue
            local info
            info=$(sudo podman run --rm raw-img modinfo -k "$kver" "$1" 2>/dev/null)
            echo "$info" | grep -q "sig_id" || {
              echo "::error::$1 not signed for $kver"
              exit 1
            }
          }

          # Module in-tree (signé par la clé kernel auto-générée intégrée)
          check_signed "overlay"

          # Akmod out-of-tree (signé avec la clé Gablue/ublue, requis en SecureBoot)
          check_signed "v4l2loopback"

          if [ "${{ inputs.image_variant }}" = "nvidia" ] || [ "${{ inputs.image_variant }}" = "nvidia-open" ]; then
            check_signed "nvidia"
            echo "NVIDIA kmods signed OK"
          fi

          echo "SecureBoot check passed"

      # Métriques de build (espace disque, taille image, etc.)
      - name: Collect build metrics
        id: metrics
        run: |
          IMG_NAME="${{ inputs.image_name }}"
          BUILD_TIME=$(( $(date +%s) - BUILD_START ))
          BUILD_TIME_FMT="$((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Espace disque
          ROOT_FREE=$(df -h / | awk 'NR==2{print $4}')
          ROOT_USED=$(df -h / | awk 'NR==2{print $3}')
          ROOT_SIZE=$(df -h / | awk 'NR==2{print $2}')
          ROOT_PCT=$(df -h / | awk 'NR==2{print $5}')

          # Taille de l'image
          IMG_SIZE=$(sudo podman images raw-img --format '{{.Size}}' 2>/dev/null || echo "N/A")

          # Nombre de paquets RPM
          PKG_COUNT=$(sudo podman run --rm raw-img rpm -qa 2>/dev/null | wc -l || echo "N/A")

          # Versions
          KERNEL_VER=$(sudo podman run --rm raw-img rpm -q --qf '%{VERSION}-%{RELEASE}' kernel-core 2>/dev/null || echo "N/A")
          MESA_VER=$(sudo podman run --rm raw-img rpm -q --qf '%{VERSION}' mesa-dri-drivers.x86_64 2>/dev/null || echo "N/A")

          # JSON
          METRICS_FILE="${IMG_NAME}-metrics.json"
          jq -n \
            --arg image "$IMG_NAME" \
            --arg timestamp "$TIMESTAMP" \
            --arg build_time "$BUILD_TIME" \
            --arg root_free "$ROOT_FREE" \
            --arg root_used "$ROOT_USED" \
            --arg root_size "$ROOT_SIZE" \
            --arg root_pct "$ROOT_PCT" \
            --arg img_size "$IMG_SIZE" \
            --arg pkg_count "$PKG_COUNT" \
            --arg kernel "$KERNEL_VER" \
            --arg mesa "$MESA_VER" \
            '{
              image: $image,
              timestamp: $timestamp,
              build_time_s: $build_time,
              disk: {
                root: { size: $root_size, used: $root_used, free: $root_free, pct: $root_pct }
              },
              image_size: $img_size,
              compressed_size: "N/A",
              package_count: $pkg_count,
              kernel: $kernel,
              mesa: $mesa
            }' > "$METRICS_FILE"

          # Step summary (différé — sera écrit après le push pour inclure
          # la taille compressée réelle)
          METRICS_SUMMARY="/tmp/${IMG_NAME}-summary.md"
          {
            echo "## 📊 Build metrics — ${IMG_NAME}"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Timestamp | ${TIMESTAMP} |"
            echo "| Build time | ${BUILD_TIME_FMT} |"
            echo "| Image size | ${IMG_SIZE} |"
            echo "| Compressed size | N/A |"
            echo "| RPM packages | ${PKG_COUNT} |"
            echo "| Kernel | ${KERNEL_VER} |"
            echo "| Mesa | ${MESA_VER} |"
            echo ""
            echo "### Disk space"
            echo ""
            echo "| Mount point | Size | Used | Free | % |"
            echo "|-------------|------|------|------|---|"
            echo "| / | ${ROOT_SIZE} | ${ROOT_USED} | ${ROOT_FREE} | ${ROOT_PCT} |"
          } > "$METRICS_SUMMARY"

          cat "$METRICS_FILE"

      # Rechunk de l'image avec rpm-ostree (après application des labels)
      # Retry : le loopback BTRFS peut subir des erreurs transitoires. On
      # abandonne immédiatement sur les erreurs I/O (loopback mort — non
      # récupérable, cf. AGENTS.md).
      - name: Rechunk Image
        id: rechunk
        run: |
          container=$(sudo buildah from raw-img)
          mnt=$(sudo buildah mount $container)
          sudo bash -c "rm -rf $mnt/run/.[!.]* $mnt/run/* $mnt/tmp/.[!.]* $mnt/tmp/*"
          sudo buildah umount $container
          sudo buildah commit --identity-label=false --rm $container raw-img

          rechunk_log=$(mktemp)
          for attempt in 1 2 3; do
            echo "::group::Rechunk attempt $attempt"
            set +e -o pipefail
            sudo podman run --rm --privileged --volume /var/lib/containers:/var/lib/containers \
                raw-img \
                rpm-ostree compose build-chunked-oci \
                --bootc --max-layers 127 --format-version 2 \
                --from localhost/raw-img --output containers-storage:localhost/chunked-img 2>&1 | tee "$rechunk_log"
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              rm -f "$rechunk_log"
              break
            fi
            if grep -qE "no space left on device|read-only file system|disk I/O error|Input/output error" "$rechunk_log"; then
              echo "::error::Erreur I/O non récupérable lors du rechunk — arrêt"
              rm -f "$rechunk_log"
              exit 1
            fi
            # Rpmdb corrompue DANS l'image (sqlite malformed) : non récupérable,
            # la corruption est présente à chaque tentative → abandon immédiat
            if grep -qE "database disk image is malformed" "$rechunk_log"; then
              echo "::error::Rpmdb de l'image corrompue (malformed) lors du rechunk — arrêt"
              rm -f "$rechunk_log"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Échec du rechunk après 3 tentatives"
              rm -f "$rechunk_log"
              exit 1
            fi
            echo "::warning::Rechunk tentative $attempt échoué, retry dans 15s..."
            sudo podman rmi localhost/chunked-img 2>/dev/null || true
            sleep 15
          done

          sudo podman untag raw-img
          echo "ref=containers-storage:localhost/chunked-img" >> "$GITHUB_OUTPUT"

      # Génération des tags après relabel
      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          VERSION_TAG="${{ steps.relabel.outputs.version }}"
          SHA_SHORT="${GITHUB_SHA::7}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              alias_tags=("pr-${{ github.event.number }}" "${SHA_SHORT}")
          else
              alias_tags=("${VERSION_TAG}" "latest")
          fi

          echo "Generated alias tags: ${alias_tags[*]}"
          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      # Conversion registre en minuscules
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      # Installation Cosign
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.1"
        if: github.event_name != 'pull_request'

      # Push et signature de l'image avec retry bash natif
      # Pas d'action externe : un simple run: avec retry loop évite les problèmes
      # de pipe Node.js (nick-fields/retry) et la dépréciation (wretry.action)
      - name: Push To GHCR and Sign
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          # Les deux logins sont nécessaires :
          # - podman login : pour skopeo copy (push de l'image)
          # - docker login : pour cosign (lit ~/.docker/config.json pour l'auth)
          #   NE PAS RETIRER le docker login (cf. run 30272548675)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          for attempt in 1 2 3; do
            echo "::group::Push attempt $attempt"

            dest_image="${{ steps.registry_case.outputs.lowercase }}/${{ inputs.image_name }}:${{ steps.relabel.outputs.version }}"
            if sudo skopeo copy ${{ steps.rechunk.outputs.ref }} docker://$dest_image; then
              # Push réussi, récupérer le digest et signer
              DIGEST=$(sudo skopeo inspect --format '{{.Digest}}' ${{ steps.rechunk.outputs.ref }})
              cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false \
                "${{ steps.registry_case.outputs.lowercase }}/${{ inputs.image_name }}@$DIGEST"

              # Push alias tags
              for tag in ${{ steps.generate-tags.outputs.alias_tags }}; do
                dest_alias="${{ steps.registry_case.outputs.lowercase }}/${{ inputs.image_name }}:$tag"
                sudo skopeo copy ${{ steps.rechunk.outputs.ref }} docker://$dest_alias
              done
              echo "::endgroup::"
              exit 0
            fi

            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Push attempt $attempt failed, retrying in 15s..."
              sleep 15
            fi
          done

          echo "::error::All push attempts failed"
          exit 1
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # Taille compressée depuis le registre distant (l'image est déjà sur GHCR)
      - name: Update compressed size
        if: github.event_name != 'pull_request'
        run: |
          METRICS_FILE="${{ inputs.image_name }}-metrics.json"
          dest_image="${{ steps.registry_case.outputs.lowercase }}/${{ inputs.image_name }}:${{ steps.relabel.outputs.version }}"

          COMPRESSED_BYTES=$(sudo skopeo inspect --raw docker://$dest_image 2>/dev/null | jq '([.layers[]?.size] | add) + (.config?.size // 0)' 2>/dev/null || echo "0")
          if [ "$COMPRESSED_BYTES" -gt 0 ] 2>/dev/null; then
            COMPRESSED_SIZE=$(numfmt --to=iec "$COMPRESSED_BYTES" | sed 's/G/ GB/; s/M/ MB/; s/K/ KB/')
          else
            COMPRESSED_SIZE="N/A"
          fi

          echo "Compressed image size: ${COMPRESSED_SIZE}"

          jq --arg cs "$COMPRESSED_SIZE" '.compressed_size = $cs' "$METRICS_FILE" > tmp.json && mv tmp.json "$METRICS_FILE"

          # Écrire le step summary complet avec la taille compressée réelle
          # Délimiteur # : le motif "N/A" contient un / qui casserait s/.../.../
          METRICS_SUMMARY="/tmp/${{ inputs.image_name }}-summary.md"
          sed "s#| Compressed size | N/A |#| Compressed size | ${COMPRESSED_SIZE} |#" "$METRICS_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # Fallback PRs : pas de push donc taille compressée reste N/A
      - name: Write metrics summary (PR)
        if: github.event_name == 'pull_request'
        run: |
          cat "/tmp/${{ inputs.image_name }}-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Upload des métriques de build
      - name: Upload metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metrics-${{ inputs.image_name }}
          path: ${{ inputs.image_name }}-metrics.json
          retention-days: 90
