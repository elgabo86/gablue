name: build-gablue-images
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.txt"
  # Hebdomadaire, le vendredi : la build est publiée avant le timer
  # `rpm-ostreed-automatic` du samedi 04:00 côté poste, donc l'image reçue a
  # moins de 24 h. Les mises à jour urgentes (kernel, Mesa, NVIDIA) passent par
  # un tag de commit ou workflow_dispatch, comme chez Bazzite (cron hebdo +
  # déclenchement à la demande). Un échec planifié est rejoué une fois, dans
  # le même run, par le job `retry` ci-dessous.
  schedule:
    - cron: "0 2 * * 5"
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**.md"
      - "**.txt"
  workflow_dispatch:

permissions:
  # Ces permissions servent aux jobs ISO (`iso`, `iso-after-images`), qui
  # appellent `build-gablue-live-isos.yml` : `contents: write` pour la release
  # `latest-live-iso`, `attestations: write` pour sa provenance, `actions: read`
  # pour les artifacts. Les builds d'images n'en ont pas besoin, mais une
  # chaîne d'appels ne peut jamais élever les permissions au-delà de celles du
  # run de plus haut niveau — elles doivent donc être déclarées ici.
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read

jobs:
  build-main:
    name: Build main
    concurrency:
      group: build-gablue-images-main-${{ github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[main]') || contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[all-iso]')))
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: ${{ github.ref == 'refs/heads/test' && 'gablue-main-test' || 'gablue-main' }}
      image_desc: ${{ github.ref == 'refs/heads/test' && 'Gablue main test image' || 'Gablue main image' }}
      image_variant: "main"
      source_image: "kinoite"
      fedora_version: "45"
      kernel_type: "ogc"

  build-nvidia:
    name: Build nvidia
    concurrency:
      group: build-gablue-images-nvidia-${{ github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[nvidia]') || contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[all-iso]')))
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: "gablue-nvidia"
      image_desc: "Gablue nvidia image"
      image_variant: "nvidia"
      source_image: "kinoite"
      fedora_version: "45"
      # Kernel OGC LTS : Bazzite paire le driver NVIDIA LTS closed avec le
      # kernel ogc-lts (commit 3eb7b09) — akmods-nvidia-lts ne publie plus
      # que des tags ogc-lts-*
      kernel_type: "ogc-lts"
      nvidia_flavor: "nvidia-lts"

  build-nvidia-open:
    name: Build nvidia-open
    concurrency:
      group: build-gablue-images-nvidia-open-${{ github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[nvidia]') || contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[all-iso]')))
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: ${{ github.ref == 'refs/heads/test' && 'gablue-nvidia-open-test' || 'gablue-nvidia-open' }}
      image_desc: ${{ github.ref == 'refs/heads/test' && 'Gablue nvidia-open test image' || 'Gablue nvidia-open image' }}
      image_variant: "nvidia-open"
      source_image: "kinoite"
      fedora_version: "45"
      kernel_type: "ogc"
      nvidia_flavor: "nvidia-open"

  build-dx:
    name: Build DX
    concurrency:
      group: build-gablue-images-dx-${{ github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[dx]') || contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[all-iso]')))
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: "gablue-main-dx"
      image_desc: "Gablue main-dx image (développement avec virtualisation)"
      image_variant: "main"
      source_image: "kinoite"
      fedora_version: "45"
      kernel_type: "ogc"

  build-nvidia-open-dx:
    name: Build nvidia-open DX
    concurrency:
      group: build-gablue-images-nvidia-open-dx-${{ github.ref }}
      cancel-in-progress: true
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[dx]') || contains(github.event.head_commit.message, '[nvidia]') || contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[all-iso]')))
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: "gablue-nvidia-open-dx"
      image_desc: "Gablue nvidia-open-dx image (développement avec virtualisation)"
      image_variant: "nvidia-open"
      source_image: "kinoite"
      fedora_version: "45"
      kernel_type: "ogc"
      nvidia_flavor: "nvidia-open"

  # Filet de sécurité des builds planifiées : un échec du run planifié est
  # rejoué **une fois**, comme un job de ce run et non plus dans un workflow
  # séparé. Un `workflow_run` se déclenche à CHAQUE fin de run surveillé —
  # annulé, sauté, manuel compris — donc il créait un run fantôme
  # « retry-gablue-builds » (conclusion `skipped`, 1 s) à chaque push, voire
  # plusieurs par push quand une build annulée par `cancel-in-progress`
  # finissait à son tour. Le rejeu garde la mécanique éprouvée : appel direct
  # du workflow réutilisable, jamais `workflow_dispatch` (un événement émis
  # avec GITHUB_TOKEN ne déclencherait rien, récursion bloquée par GitHub) ni
  # PAT (aucun jeton supplémentaire à gérer).
  #
  # Portée volontairement étroite, identique à l'ancien workflow : seule une
  # exécution PLANIFIÉE, à sa PREMIÈRE tentative, rejoue — un push tagué qui
  # échoue se voit tout de suite, et un « Re-run » manuel (`run_attempt` > 1)
  # est déjà une décision humaine. Un échec déterministe coûte donc une
  # seconde salve (5 images, en parallèle), puis plus rien jusqu'au créneau
  # suivant.
  #
  # Les cinq variantes sont rejouées ensemble, comme avant : le rejeu reste
  # une simple seconde salve, sans état à propager entre jobs. Groupe de
  # concurrence à part, sans annulation : un rejeu ne doit ni s'annuler
  # lui-même, ni tuer la build d'un push plus récent.
  retry:
    name: Rejouer ${{ matrix.image_name }}
    needs: [build-main, build-nvidia, build-nvidia-open, build-dx, build-nvidia-open-dx]
    if: failure() && github.event_name == 'schedule' && github.run_attempt == 1
    concurrency:
      group: build-gablue-retry-${{ matrix.image_name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Noms des variantes de `main`, écrits en dur : le rejeu ne part que
        # d'un run PLANIFIÉ, qui ne s'exécute que sur la branche par défaut —
        # les variantes `-test` des jobs de build (ternaire sur `github.ref`)
        # n'ont donc pas à être rejouées ici.
        include:
          - image_name: "gablue-main"
            image_desc: "Gablue main image"
            image_variant: "main"
            source_image: "kinoite"
            fedora_version: "45"
            kernel_type: "ogc"
            nvidia_flavor: ""
          - image_name: "gablue-nvidia"
            image_desc: "Gablue nvidia image"
            image_variant: "nvidia"
            source_image: "kinoite"
            fedora_version: "45"
            # Kernel OGC LTS : Bazzite paire le driver NVIDIA LTS closed avec
            # le kernel ogc-lts (voir build-nvidia ci-dessus)
            kernel_type: "ogc-lts"
            nvidia_flavor: "nvidia-lts"
          - image_name: "gablue-nvidia-open"
            image_desc: "Gablue nvidia-open image"
            image_variant: "nvidia-open"
            source_image: "kinoite"
            fedora_version: "45"
            kernel_type: "ogc"
            nvidia_flavor: "nvidia-open"
          - image_name: "gablue-main-dx"
            image_desc: "Gablue main-dx image (développement avec virtualisation)"
            image_variant: "main"
            source_image: "kinoite"
            fedora_version: "45"
            kernel_type: "ogc"
            nvidia_flavor: ""
          - image_name: "gablue-nvidia-open-dx"
            image_desc: "Gablue nvidia-open-dx image (développement avec virtualisation)"
            image_variant: "nvidia-open"
            source_image: "kinoite"
            fedora_version: "45"
            kernel_type: "ogc"
            nvidia_flavor: "nvidia-open"
    uses: ./.github/workflows/reusable-gablue-image.yml
    secrets: inherit
    with:
      image_name: ${{ matrix.image_name }}
      image_desc: ${{ matrix.image_desc }}
      image_variant: ${{ matrix.image_variant }}
      source_image: ${{ matrix.source_image }}
      fedora_version: ${{ matrix.fedora_version }}
      kernel_type: ${{ matrix.kernel_type }}
      nvidia_flavor: ${{ matrix.nvidia_flavor }}

  # ISO demandée seule (`[iso]`) : construite depuis les images « :latest »
  # déjà publiées, sans rebuild. Remplace l'ancien déclencheur `push` du
  # workflow ISO, qui créait un run « skipped » à chaque push sur `main` — un
  # déclencheur ne peut pas filtrer sur le message de commit, seul le job le
  # peut. `[all-iso]` ne contient pas la sous-chaîne `[iso]` : les deux jobs
  # sont exclusifs par construction.
  iso:
    name: Build Live ISO ([iso])
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[iso]')
    uses: ./.github/workflows/build-gablue-live-isos.yml
    secrets: inherit

  # `[all-iso]` : les cinq images d'abord, l'ISO ensuite, dans le MÊME run.
  # Sans `always()` volontairement : un build en échec saute l'ISO, exactement
  # comme l'ancien chaînage `workflow_run`, qui exigeait
  # `conclusion == 'success'` — on ne livre jamais une ISO bâtie sur des images
  # dont une a échoué.
  iso-after-images:
    name: Build Live ISO ([all-iso])
    needs: [build-main, build-nvidia, build-nvidia-open, build-dx, build-nvidia-open-dx]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[all-iso]')
    uses: ./.github/workflows/build-gablue-live-isos.yml
    secrets: inherit

  update-readme:
    name: Update README versions
    runs-on: ubuntu-26.04
    needs: [build-main, build-nvidia, build-nvidia-open, build-dx, build-nvidia-open-dx, retry]
    # `always()` : un run planifié sauvé par le job `retry` porte encore le
    # `needs` en échec de la première salve — sans lui, le tableau de versions
    # du README ne serait jamais mis à jour sur ces runs. Le rejeu refait les
    # cinq variantes, donc son succès suffit à garantir les cinq artifacts.
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.retry.result == 'success' ||
       (needs.build-main.result == 'success' &&
        needs.build-nvidia.result == 'success' &&
        needs.build-nvidia-open.result == 'success' &&
        needs.build-dx.result == 'success' &&
        needs.build-nvidia-open-dx.result == 'success'))
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Téléchargement via gh CLI avec retry : cohérence avec le workflow ISO
      # (tolérance au 404 transitoire de l'API artifacts). gh run download
      # crée un sous-dossier par artifact, on aplatit pour reproduire
      # merge-multiple: true.
      # Fenêtre de retry volontairement large : 10 × 30 s ≈ 4 min 30 s de
      # patience, car l'API artifacts renvoie des 503 « Egress is over the
      # account limit » (incident de stockage côté GitHub) qui durent des
      # minutes — la fenêtre 6 × 15 s (~90 s) de 10/2026 a suffi à faire
      # échouer un run dont les 5 builds étaient verts (run 39912731811).
      # on_retry_command vide le dossier partiel : sans ça, un JSON d'une
      # tentative précédente pourrait satisfaire la vérification de présence
      # alors que le téléchargement courant a échoué.
      - name: Download version artifacts
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_wait_seconds: 30
          on_retry_command: rm -rf versions-data
          command: |
            mkdir -p versions-data
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              -p 'versions-*' -D versions-data
            find versions-data -mindepth 2 -name '*.json' -exec mv {} versions-data/ \;
            find versions-data -mindepth 1 -type d -delete
            # Vérification : gh run download peut retourner 0 malgré un échec
            # partiel (ex. HTTP 503 sur un artifact, run 32050114931) — les 5
            # JSON doivent être présents, sinon exit 1 pour déclencher le retry
            for img in gablue-main gablue-nvidia gablue-nvidia-open gablue-main-dx gablue-nvidia-open-dx; do
              if [ ! -f "versions-data/${img}.json" ]; then
                echo "::error::versions-data/${img}.json manquant après téléchargement (échec partiel)"
                exit 1
              fi
            done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update README with versions
        id: update_readme
        run: |
          # Lire les versions depuis les artifacts (fichiers nommés par image)
          main_json=$(cat versions-data/gablue-main.json)
          
          # Extraire les versions communes
          fedora=$(echo "$main_json" | jq -r '.fedora')
          kernel=$(echo "$main_json" | jq -r '.kernel')
          mesa=$(echo "$main_json" | jq -r '.mesa')
          plasma=$(echo "$main_json" | jq -r '.plasma')
          export fedora kernel mesa plasma build_date nvidia_closed nvidia_open
          
          # Extraire les versions NVIDIA spécifiques
          nvidia_closed="N/A"
          nvidia_open="N/A"
          if [ -f versions-data/gablue-nvidia.json ]; then
            nvidia_closed=$(jq -r '.nvidia' versions-data/gablue-nvidia.json)
          fi
          if [ -f versions-data/gablue-nvidia-open.json ]; then
            nvidia_open=$(jq -r '.nvidia' versions-data/gablue-nvidia-open.json)
          fi
          
          # Date du build (UTC)
          build_date=$(date -u +'%Y-%m-%d')
          
          # Construire la section markdown avec balises
           /usr/bin/python3 -c "
          import re, os

          fedora = os.environ['fedora']
          kernel = os.environ['kernel']
          # Reformater 7.3.1-ogc6.1.fc45 -> 7.3.1 (rev 6.1)
          m = re.match(r'^(\d+\.\d+\.\d+)-ogc([\d.]+)\.fc\d+.*$', kernel)
          if m:
              kernel = f'{m.group(1)} (rev {m.group(2)})'
          mesa = os.environ['mesa']
          plasma = os.environ['plasma']
          nvidia_closed = os.environ['nvidia_closed']
          nvidia_open = os.environ['nvidia_open']
          build_date = os.environ['build_date']

          table = (
              '| Component | Version |\n'
              '|---' + '|---' + '|\n'
              f'| Last build | {build_date} |\n'
              f'| Fedora | {fedora} |\n'
              f'| Kernel (OGC) | {kernel} |\n'
              f'| Mesa (Terra) | {mesa} |\n'
              f'| KDE Plasma | {plasma} |\n'
              f'| NVIDIA (open) | {nvidia_open} |\n'
              f'| NVIDIA (closed) | {nvidia_closed} |'
          )
          
          new_section = f'<!-- VERSIONS_START -->\n\n{table}\n\n<!-- VERSIONS_END -->'
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          if '<!-- VERSIONS_START -->' not in content:
              # Ajouter la section avant la section Installation
              content = content.replace('## Installation', new_section + '\n\n## Installation')
          else:
              # Remplacer la section existante
              content = re.sub(
                  r'<!-- VERSIONS_START -->.*?<!-- VERSIONS_END -->',
                  new_section,
                  content,
                  flags=re.DOTALL
              )
          
          with open('README.md', 'w') as f:
              f.write(content)
          
          print('README mis à jour avec les versions.')
          print(f'  Fedora: {fedora}')
          print(f'  Kernel: {kernel}')
          print(f'  Mesa: {mesa}')
          print(f'  Plasma: {plasma}')
          print(f'  NVIDIA closed: {nvidia_closed}')
          print(f'  NVIDIA open: {nvidia_open}')
          "
          
          # Vérifier si des changements ont eu lieu
          if git diff --quiet README.md; then
            echo "Aucun changement de version détecté."
            echo "skip_commit=true" >> $GITHUB_OUTPUT
          else
            echo "Changements de version détectés :"
            git diff README.md
            echo "skip_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated README
        if: steps.update_readme.outputs.skip_commit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[skip ci] docs: update versions table in README"
          # Réessayer le push en cas de commit concurrent sur main (rebase puis push)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi."
              exit 0
            fi
            echo "Push rejeté (tentative $i), rebase sur origin/main..."
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "::error::Échec du push du README après 5 tentatives"
          exit 1
