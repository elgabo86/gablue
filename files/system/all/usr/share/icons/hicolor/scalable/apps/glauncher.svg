<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gablue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a86d8"/>
      <stop offset="1" stop-color="#24549a"/>
    </linearGradient>
    <mask id="gcut">
      <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
      <g transform="translate(128,128) rotate(45) scale(0.8)">
        <use href="#sword" fill="#000000" stroke="#000000" stroke-width="7"
             stroke-linejoin="round"/>
      </g>
    </mask>
    <g id="sword">
      <path d="M 0 -104 L 12 -72 L 12 8 L -12 8 L -12 -72 Z"/>
      <rect x="-36" y="8" width="72" height="14" rx="4"/>
      <rect x="-7" y="22" width="14" height="34" rx="5"/>
      <circle cx="0" cy="63" r="10"/>
    </g>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#gablue)"/>
  <g mask="url(#gcut)" fill="#ffffff">
    <!-- anneau ouvert en haut à droite, puis la barre du G à mi-hauteur -->
    <path d="M 152.72 51.92 A 80 80 0 1 0 208.00 128"
          fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="butt"/>
    <rect x="128" y="113.0" width="95.0" height="30"/>
  </g>
  <g transform="translate(128,128) rotate(45) scale(0.8)" fill="#ffffff">
    <use href="#sword"/>
  </g>
</svg>
