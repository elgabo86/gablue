# Correction composefs : Dolphin lancé par activation D-Bus (interface
# org.freedesktop.FileManager1, « Ouvrir le dossier contenant » des autres
# applications) démarre via cette unité SANS le LD_PRELOAD injecté dans le
# .desktop → la barre d'espace libre affiche 0 o sur l'overlay composefs de /
# et ce daemon sert ensuite toutes les fenêtres jusqu'au reboot
# Réinjecte le hook ici : les processus enfants (kioworker) héritent de l'env
[Service]
Environment=LD_PRELOAD=/usr/lib64/gablue-composefs-fix.so
