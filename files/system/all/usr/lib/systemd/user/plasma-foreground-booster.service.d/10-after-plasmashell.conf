# Correctif amont kcgroups 0.2 (pixelcluster/kcgroups, tag
# booster-dmemcg-experimental-0.2 : « We need an actual session to spawn in,
# wait for that to exist ») — le paquet Terra 0.1-3 ne le porte pas encore.
# Sans ordonnancement, le booster est lancé en parallèle du compositeur : le
# socket Wayland n'existe pas encore, Qt ne trouve aucun plugin de plateforme
# et abort (SIGABRT + coredump à chaque login), avant de repartir au restart.
# plasmashell (Type=dbus) signale un démarrage réel, contrairement à
# plasma-kwin_wayland (Type=simple) qui ne garantit pas le socket.
[Unit]
After=plasma-plasmashell.service
