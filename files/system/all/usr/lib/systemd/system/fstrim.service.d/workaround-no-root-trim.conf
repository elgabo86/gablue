# Correction fstrim pour composefs : /etc/fstab ne reflète pas les montages
# réels, on se base uniquement sur /proc/self/mountinfo
# (aligné Bazzite 8a76282f, fedora-silverblue/issue-tracker#689)

[Unit]
Description=Discard unused blocks on mounted filesystems
Documentation=man:fstrim(8) https://forge.fedoraproject.org/atomic/tracker/issues/81

[Service]
# ExecStart= vide obligatoire : fstrim.service est Type=oneshot, sans reset le
# drop-in AJOUTE une seconde exécution au lieu de remplacer l'originale
# (le drop-in Bazzite 8a76282f l'omet → fstrim tournerait deux fois)
ExecStart=
ExecStart=/usr/bin/fstrim --listed-in /proc/self/mountinfo --verbose --quiet-unsupported
