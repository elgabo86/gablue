# Réclamation dynamique de l'espace btrfs (Bazzite 06732aa5, 11/2026).
# Sans elle, btrfs peut refuser une écriture avec ENOSPC alors qu'il reste de
# l'espace libre (blocs de données fragmentés) : le reclaim n'est pas activé par
# défaut par le kernel. Les deux attributs sont par montage ; le glob couvre la
# racine et tout montage btrfs supplémentaire présent au démarrage.
# À retirer quand l'amont active le reclaim par défaut.

w /sys/fs/btrfs/*/allocation/data/dynamic_reclaim - - - - 1
w /sys/fs/btrfs/*/allocation/data/periodic_reclaim - - - - 1
