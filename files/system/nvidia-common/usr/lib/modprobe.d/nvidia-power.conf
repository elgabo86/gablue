# Gestion d'alimentation NVIDIA (aligné sur Bazzite)
# S0ix : support du modern standby (s2idle) sur laptops
# DynamicPowerManagement=0x02 : runtime PM fine-grained (RTD3)
# https://download.nvidia.com/XFree86/Linux-x86_64/README/powermanagement.html
options nvidia NVreg_EnableS0ixPowerManagement=1 NVreg_DynamicPowerManagement=0x02
